    Uuid:
      type: string
      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    UserId:
      type: string
      minLength: 1
      maxLength: 128
      description: Platform user id exactly as the server reports it, for example steam_<SteamID64>, gdk_<XUID> or ps5_<id>. Treated as an opaque key. Never shown publicly.
    PlayerUid:
      type:
        - string
        - 'null'
      pattern: ^[0-9A-F]{32}$
      description: The 32-hex player UID the server derives from the user id and uses to name the player's save file; null while the player is still loading.
    CollectorInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        run_id:
          $ref: '#/components/schemas/Uuid'
        os:
          type: string
        arch:
          type: string
      required:
        - name
        - version
        - run_id
      additionalProperties: true
    ServerInfo:
      type: object
      description: What the server reports on REST /v1/api/info.
      properties:
        version:
          type: string
        name:
          type: string
        description:
          type: string
        world_guid:
          type: string
      required:
        - version
        - name
        - world_guid
      additionalProperties: true
    CollectorEvent:
      description: One event. A documented type must carry the data of its schema; the site stores an event whose data does not match and flags it instead of rejecting its batch. Other types are stored as they are.
      anyOf:
        - $ref: '#/components/schemas/CollectorStartedEvent'
        - $ref: '#/components/schemas/CollectorHeartbeatEvent'
        - $ref: '#/components/schemas/ServerOnlineEvent'
        - $ref: '#/components/schemas/ServerOfflineEvent'
        - $ref: '#/components/schemas/ServerMetricsEvent'
        - $ref: '#/components/schemas/WorldSnapshotEvent'
        - $ref: '#/components/schemas/PlayerConnectedEvent'
        - $ref: '#/components/schemas/PlayerJoinedEvent'
        - $ref: '#/components/schemas/PlayerLeftEvent'
        - $ref: '#/components/schemas/PlayerLevelUpEvent'
        - $ref: '#/components/schemas/PlayerDiedEvent'
        - $ref: '#/components/schemas/ChatMessageEvent'
        - $ref: '#/components/schemas/AdminCommandEvent'
        - $ref: '#/components/schemas/PlayerKickedEvent'
        - $ref: '#/components/schemas/PlayerBannedEvent'
        - $ref: '#/components/schemas/PlayerUnbannedEvent'
        - $ref: '#/components/schemas/ActionCompletedEvent'
        - $ref: '#/components/schemas/ActionFailedEvent'
        - $ref: '#/components/schemas/SavePlayerEvent'
        - $ref: '#/components/schemas/SaveGuildEvent'
        - $ref: '#/components/schemas/SaveBaseEvent'
        - $ref: '#/components/schemas/SaveReadEvent'
        - $ref: '#/components/schemas/PalCapturedEvent'
        - $ref: '#/components/schemas/PalHatchedEvent'
        - $ref: '#/components/schemas/BossDefeatedEvent'
        - $ref: '#/components/schemas/TechnologyUnlockedEvent'
        - $ref: '#/components/schemas/StructureBuiltEvent'
        - $ref: '#/components/schemas/OtherEvent'
    IngestBatch:
      type: object
      description: Signed batch posted by the collector. At most 500 events and 512 KB per request.
      properties:
        collector:
          $ref: '#/components/schemas/CollectorInfo'
        server:
          anyOf:
            - $ref: '#/components/schemas/ServerInfo'
            - type: 'null'
        events:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CollectorEvent'
      required:
        - collector
        - server
        - events
      additionalProperties: true
    CollectorAction:
      type: object
      description: An admin action for the collector to carry out through the server's REST API. The collector reports the outcome with action.completed or action.failed.
      properties:
        id:
          type: integer
        kind:
          type: string
          enum:
            - announce
            - kick
            - ban
            - unban
            - save
            - shutdown
        message:
          type:
            - string
            - 'null'
          maxLength: 200
        user_id:
          anyOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        waittime_s:
          type:
            - integer
            - 'null'
          minimum: 1
          description: For shutdown, the seconds the server waits before it saves and stops.
      required:
        - id
        - kind
        - message
        - user_id
        - waittime_s
      additionalProperties: false
    IngestResult:
      type: object
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        invalid:
          type: integer
          minimum: 0
          description: Events stored but flagged because their data did not match the schema of their type.
        last_seq:
          type:
            - integer
            - 'null'
          minimum: 0
        actions:
          type: array
          items:
            $ref: '#/components/schemas/CollectorAction'
      required:

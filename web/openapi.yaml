openapi: 3.1.0
info:
  title: Skylark API
  version: 1.0.0
  summary: Public read API, admin API, live stream and collector ingest of a Skylark site.
  description: 'Conventions: JSON UTF-8; timestamps ISO 8601 UTC with Z; world coordinates x, y and z in Unreal units (centimetres) exactly as the Palworld server reports them; durations in seconds unless the field name ends in _ms. Errors: the HTTP status plus { error: { code, message } }. Public responses never contain IP addresses or platform user ids. The collector posts signed batches to /api/ingest; every event carries an id, a per-run sequence number, the collector run id, a UTC timestamp, a type and a data object. The site validates the data of the event types documented here, stores events of unknown types without processing them, ignores unknown fields, and flags an event whose data does not match its schema instead of rejecting its batch, so collectors and sites of different versions keep working together.'
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:5173
    description: Local development server (npm run dev, npm run dev:mock).
  - url: http://localhost:3000
    description: Local production image.
security: []
tags:
  - name: public
    description: What anyone can read about the server and its players.
  - name: stream
    description: Live updates as server-sent events.
  - name: admin
    description: Settings, collector connection, players, server actions, events, backups and jobs. Needs the admin session cookie; changes also need a same-origin Origin header.
  - name: system
    description: Health, site information and this contract.
  - name: ingest
    description: Signed batches from the collector.
paths:
  /api/v1/status:
    get:
      operationId: getStatus
      tags:
        - public
      summary: Server status
      description: Online, offline or unknown (the site has lost contact with its collector), the player count, server performance, the in-game clock and what the collector can see.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/status/history:
    get:
      operationId: getStatusHistory
      tags:
        - public
      summary: Status history
      description: Server state, player counts and frame rate in time buckets (5 minutes for 24h, 1 hour for 7d, 6 hours for 30d), oldest first.
      parameters:
        - name: range
          in: query
          required: false
          description: How far back.
          schema:
            type: string
            enum:
              - 24h
              - 7d
              - 30d
            default: 24h
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/online:
    get:
      operationId: getOnline
      tags:
        - public
      summary: Players online
      description: The players in the world now, longest online first. Positions need the positions feature and party Pals the pals feature.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineList'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/activity:
    get:
      operationId: listActivity
      tags:
        - public
      summary: Activity feed
      description: What happened on the server, newest first. Chat items need the chat feature (guild chat also guild_chat); base items need the bases feature.
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated activity types to include.
          schema:
            type: string
        - $ref: '#/components/parameters/PlayerFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/players:
    get:
      operationId: listPlayers
      tags:
        - public
      summary: Players
      description: Every player the site has seen, except hidden ones.
      parameters:
        - name: sort
          in: query
          required: false
          description: Order of the list. playtime, level and last_seen sort highest first, name alphabetically.
          schema:
            type: string
            enum:
              - last_seen
              - playtime
              - level
              - name
            default: last_seen
        - name: q
          in: query
          required: false
          description: Only players whose name contains this text, ignoring case.
          schema:
            type: string
            maxLength: 64
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/players/{id}:
    get:
      operationId: getPlayer
      tags:
        - public
      summary: Player
      description: A player with their totals, current session, level history, recent sessions and deaths. A hidden player answers 404.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/players/{id}/sessions:
    get:
      operationId: listPlayerSessions
      tags:
        - public
      summary: A player's sessions
      description: Newest first.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/players/{id}/trail:
    get:
      operationId: getPlayerTrail
      tags:
        - public
      summary: A player's trail
      description: Where the player went during one session, oldest first, at most 2000 points. Needs the positions feature.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
        - name: session
          in: query
          required: false
          description: Session id; the current or latest session when absent.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/chat:
    get:
      operationId: listChat
      tags:
        - public
      summary: Chat
      description: Chat messages newest first. Needs the chat feature; guild messages also need guild_chat.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/guilds:
    get:
      operationId: listGuilds
      tags:
        - public
      summary: Guilds
      description: Guilds with at least one current member, most members first.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildList'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/guilds/{id}:
    get:
      operationId: getGuild
      tags:
        - public
      summary: Guild
      description: A guild with its current members and, with the bases feature, its bases.
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/map:
    get:
      operationId: getMap
      tags:
        - public
      summary: Live map
      description: Players, bases, wild Pals near players and the deaths of the last 24 hours, each only when its feature is on.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapState'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/leaderboards:
    get:
      operationId: getLeaderboards
      tags:
        - public
      summary: Leaderboards
      description: The top ten players in each category, hidden players left out. A category whose feature is off is empty.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboards'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/world:
    get:
      operationId: getWorld
      tags:
        - public
      summary: World
      description: The server's world settings, its in-game clock and totals since the site began tracking.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/stream:
    get:
      operationId: streamEvents
      tags:
        - stream
      summary: Live stream
      description: "Server-sent events. Event names: status (the Status object, on connect and whenever it changes), online (the OnlineList, on connect and on change), map (the MapState, on connect and after each world snapshot, at most every 5 s) and activity (one ActivityItem per new feed item, with the frame id set to the event id). When a later event changes a feed item that was already sent, for example the server mod's knockout merging into a snapshot knockout, the item is sent again with the same ActivityItem id and no frame id; clients replace the item they hold with that id. A comment frame every 15 s keeps the connection alive. A reconnect with Last-Event-ID first replays up to 100 newer activity items."
      parameters:
        - $ref: '#/components/parameters/LastEventId'
        - name: last_event_id
          in: query
          required: false
          description: Same as the Last-Event-ID header, for clients that reconnect manually.
          schema:
            type: string
      responses:
        '200':
          description: An event stream that stays open.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamFrame'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Health
      description: Container health check.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/site:
    get:
      operationId: getSite
      tags:
        - system
      summary: Site information
      description: The site name, the project version and the features the admin has switched on.
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/openapi.json:
    get:
      operationId: getOpenApi
      tags:
        - system
      summary: This contract
      description: The OpenAPI document the site serves and validates against, as JSON.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/v1/admin/login:
    post:
      operationId: adminLogin
      tags:
        - admin
      summary: Log in
      description: Sets an HttpOnly, SameSite=Lax (Secure on https) session cookie. Limited to 5 attempts per minute per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Logged in; the cookie is set.
          headers:
            Set-Cookie:
              description: The admin session cookie.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/logout:
    post:
      operationId: adminLogout
      tags:
        - admin
      summary: Log out
      description: Ends the admin session and clears the cookie.
      security:
        - adminCookie: []
      responses:
        '204':
          description: Logged out; the cookie is cleared.
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/session:
    get:
      operationId: getAdminSession
      tags:
        - admin
      summary: Session state
      description: Whether the cookie holds a valid admin session.
      responses:
        '200':
          description: Whether the cookie holds a valid session, and whether the first password still has to be set.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/setup:
    post:
      operationId: adminSetup
      tags:
        - admin
      summary: Set the first admin password
      description: Stores the admin password as a scrypt hash and logs in. Only while no password is stored and ADMIN_PASSWORD is not set. Limited to 5 attempts per minute per address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '204':
          description: Password stored and logged in; the cookie is set.
          headers:
            Set-Cookie:
              description: The admin session cookie.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/settings:
    get:
      operationId: getAdminSettings
      tags:
        - admin
      summary: Site settings
      description: The site name and the feature switches, with the settings fixed by environment variables.
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: updateAdminSettings
      tags:
        - admin
      summary: Change site settings
      description: Changes the given settings and keeps the others. A setting whose environment variable is set cannot be changed here.
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSettingsUpdate'
      responses:
        '200':
          description: The settings after the change.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/collector:
    get:
      operationId: getAdminCollector
      tags:
        - admin
      summary: Collector connection
      description: The secret the collector signs with, the recent collector runs and the ingest counters of the last 24 hours.
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/collector/secret:
    post:
      operationId: regenerateCollectorSecret
      tags:
        - admin
      summary: Replace the collector secret
      description: The running collector is rejected until it is given the new secret.
      security:
        - adminCookie: []
      responses:
        '200':
          description: The new secret.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/players:
    get:
      operationId: listAdminPlayers
      tags:
        - admin
      summary: Players with their platform ids
      description: Every player with the platform ids that public responses leave out.
      parameters:
        - name: q
          in: query
          required: false
          description: Only players whose name, account name or user id contains this text, ignoring case.
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      security:
        - adminCookie: []
      responses:
        '200':
          description: Most recently seen first, hidden players included.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlayerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/players/{id}:
    patch:
      operationId: updateAdminPlayer
      tags:
        - admin
      summary: Rename or hide a player
      description: Sets or removes a name override and hides or shows the player.
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerPatch'
      responses:
        '200':
          description: The player after the change.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPlayer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/actions:
    get:
      operationId: listActions
      tags:
        - admin
      summary: Server actions
      description: The 50 most recent actions, newest first, with their delivery state.
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createAction
      tags:
        - admin
      summary: Queue a server action
      description: The collector picks the action up with its next batch, carries it out through the server's REST API and reports the outcome. announce needs a message; kick and ban need a player or user id; unban needs one too; shutdown needs waittime_s and shows the message in game while it counts down.
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionCreate'
      responses:
        '201':
          description: Queued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/actions/{id}:
    delete:
      operationId: cancelAction
      tags:
        - admin
      summary: Cancel a server action
      description: Only an action the collector has not picked up yet can be cancelled.
      parameters:
        - $ref: '#/components/parameters/ActionId'
      security:
        - adminCookie: []
      responses:
        '200':
          description: The cancelled action.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/events:
    get:
      operationId: listAdminEvents
      tags:
        - admin
      summary: Raw events
      description: Stored events newest first, with their data exactly as received.
      parameters:
        - name: type
          in: query
          required: false
          description: Only this event type.
          schema:
            type: string
            maxLength: 64
        - name: invalid
          in: query
          required: false
          description: Only events flagged as invalid.
          schema:
            type: boolean
        - $ref: '#/components/parameters/PlayerFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/projections/rebuild:
    post:
      operationId: rebuildProjections
      tags:
        - admin
      summary: Rebuild sessions and history
      description: Replays every stored event in time order to rebuild sessions, level-ups, deaths, chat and the player totals. Ingest answers 503 while it runs.
      security:
        - adminCookie: []
      responses:
        '202':
          description: Queued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/backups:
    get:
      operationId: listBackups
      tags:
        - admin
      summary: Backups
      description: Database backups on the backup volume, newest first.
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/backups/run:
    post:
      operationId: runBackup
      tags:
        - admin
      summary: Back up now
      description: Dumps the database to the backup volume and keeps the 14 newest backups.
      security:
        - adminCookie: []
      responses:
        '202':
          description: Queued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/jobs/{id}:
    get:
      operationId: getJob
      tags:
        - admin
      summary: Job state
      description: Progress of a rebuild or backup job.
      parameters:
        - $ref: '#/components/parameters/JobId'
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/health:
    get:
      operationId: getAdminHealth
      tags:
        - admin
      summary: Site health
      description: The collector connection, ingest counters, database size, backups and background jobs.
      security:
        - adminCookie: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/ingest:
    post:
      operationId: ingestBatch
      tags:
        - ingest
      summary: Collector batch
      description: Verifies the timestamp window (5 minutes) and the HMAC with a constant-time comparison, stores every event it has not seen (duplicates by event id are counted and skipped), applies the documented event types to the site's views in the same transaction, and answers with the admin actions the collector should carry out.
      security:
        - collectorSignature: []
      parameters:
        - $ref: '#/components/parameters/SkylarkTimestamp'
        - $ref: '#/components/parameters/SkylarkSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestBatch'
      responses:
        '200':
          description: Counts for the batch and the pending actions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '401':
          description: 'unauthorized: bad signature or stale timestamp.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 'payload_too_large: body over 512 KB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'unprocessable: the body is not JSON or the batch envelope is malformed. Events with bad data never cause this; they are flagged.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'unavailable: the database cannot be reached; the collector retries.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  headers:
    CacheControl:
      description: public, max-age=15 on public GET responses.
      schema:
        type: string
    ETag:
      description: Entity tag of the response body.
      schema:
        type: string
    NoStore:
      description: no-store on stream, admin and ingest responses.
      schema:
        type: string
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous next_cursor.
      schema:
        type: string
    PlayerFilter:
      name: player
      in: query
      required: false
      description: Only items involving this player id.
      schema:
        type: integer
        minimum: 1
    PlayerId:
      name: id
      in: path
      required: true
      description: Player id.
      schema:
        type: integer
        minimum: 1
    GuildId:
      name: id
      in: path
      required: true
      description: Guild id as the server reports it.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ActionId:
      name: id
      in: path
      required: true
      description: Action id.
      schema:
        type: integer
        minimum: 1
    JobId:
      name: id
      in: path
      required: true
      description: Job id.
      schema:
        type: integer
        minimum: 1
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Sent by EventSource on reconnect; newer activity items are replayed first (at most 100).
      schema:
        type: string
    SkylarkTimestamp:
      name: X-Skylark-Timestamp
      in: header
      required: true
      description: Signature timestamp.
      schema:
        type: integer
        description: Unix seconds; must be within 5 minutes of the site clock.
    SkylarkSignature:
      name: X-Skylark-Signature
      in: header
      required: true
      description: HMAC-SHA256 of timestamp + "." + body with the collector secret.
      schema:
        type: string
        pattern: ^sha256=[0-9a-f]{64}$
  responses:
    RateLimited:
      description: 'rate_limited: more than 120 requests per minute from this address.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: 'bad_request: a parameter or body field is invalid.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'unauthorized: no valid admin session, or a wrong password.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'forbidden: the Origin header does not match the site.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'not_found: no such resource, or its feature is switched off.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'conflict: the request clashes with the current state, for example a setting fixed by an environment variable or a job that is already running.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 'unavailable: the database cannot be reached.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: admin_session
      description: The session cookie set by /api/v1/admin/login or /api/v1/admin/setup.
    collectorSignature:
      type: apiKey
      in: header
      name: X-Skylark-Signature
      description: sha256=<hex HMAC-SHA256> over X-Skylark-Timestamp + "." + body with the collector secret (COLLECTOR_SECRET, or the one on the admin Collector page).
  schemas:
    Error:
      type: object
      description: Error envelope returned with every non-2xx status.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - payload_too_large
                - unprocessable
                - rate_limited
                - unavailable
                - not_implemented
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Health:
      type: object
      properties:
        ok:
          type: boolean
        db:
          type: boolean
        mock:
          type: boolean
        version:
          type: string
      required:
        - ok
        - db
        - mock
        - version
      additionalProperties: false
    SiteFeatures:
      type: object
      description: Switches the admin controls. A switched-off feature leaves the menu, its API routes answer 404, and its data leaves the feed and the stream.
      properties:
        chat:
          type: boolean
          description: Global and Say chat in the feed, the chat page and the stream.
        guild_chat:
          type: boolean
          description: Guild chat as well. Off by default.
        positions:
          type: boolean
          description: Player positions, trails, death spots and the live map.
        bases:
          type: boolean
          description: Base locations on the map and on guild pages. Servers with PvP raiding may want it off.
        pals:
          type: boolean
          description: Party Pals, base workers and wild Pals near players.
      required:
        - chat
        - guild_chat
        - positions
        - bases
        - pals
      additionalProperties: false
    Site:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
          description: The project version, shared by the site and the collector.
        features:
          $ref: '#/components/schemas/SiteFeatures'
      required:
        - name
        - version
        - features
      additionalProperties: false
    PlayerRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
        - id
        - name
      additionalProperties: false
    GuildRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      additionalProperties: false
    Platform:
      type: string
      description: steam is Steam, gdk Xbox or the Microsoft Store, ps5 PlayStation 5, mac the Mac App Store, other an unknown prefix.
      enum:
        - steam
        - gdk
        - ps5
        - mac
        - other
    Point:
      type: object
      description: A world position in Unreal units, as the server reports it.
      properties:
        x:
          type: number
        y:
          type: number
      required:
        - x
        - y
      additionalProperties: false
    PartyPal:
      type: object
      description: A Pal out of its sphere beside its owner.
      properties:
        species:
          type: string
          description: The species key from the Blueprint class, for example SheepBall.
        name:
          type:
            - string
            - 'null'
        level:
          type: integer
      required:
        - species
        - name
        - level
      additionalProperties: false
    StatusState:
      type: string
      description: unknown when the site has lost contact with its collector or has never heard from one.
      enum:
        - online
        - offline
        - unknown
    WorldClock:
      type: object
      description: The in-game clock as last observed. It advances 45 in-game minutes per real minute, times day_speed by day and night_speed by night.
      properties:
        time:
          type:
            - string
            - 'null'
          pattern: ^[0-9]{2}:[0-9]{2}$
        day:
          type:
            - integer
            - 'null'
          minimum: 0
        observed_at:
          type:
            - string
            - 'null'
          format: date-time
        day_speed:
          type:
            - number
            - 'null'
        night_speed:
          type:
            - number
            - 'null'
      required:
        - time
        - day
        - observed_at
        - day_speed
        - night_speed
      additionalProperties: false
    CollectorLayersSummary:
      type: object
      description: What the collector reads, and so what this site can show.
      properties:
        rest:
          type: boolean
        gamedata:
          type: boolean
        logs:
          type: boolean
        saves:
          type: boolean
        mod:
          type: boolean
      required:
        - rest
        - gamedata
        - logs
        - saves
        - mod
      additionalProperties: false
    StatusServer:
      type: object
      properties:
        name:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        version:
          type:
            - string
            - 'null'
      required:
        - name
        - description
        - version
      additionalProperties: false
    StatusPlayers:
      type: object
      properties:
        online:
          type: integer
          minimum: 0
        max:
          type:
            - integer
            - 'null'
          minimum: 0
      required:
        - online
        - max
      additionalProperties: false
    StatusPerformance:
      type: object
      properties:
        fps:
          type:
            - number
            - 'null'
        fps_avg:
          type:
            - number
            - 'null'
        frame_time_ms:
          type:
            - number
            - 'null'
        uptime_s:
          type:
            - number
            - 'null'
        measured_at:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - fps
        - fps_avg
        - frame_time_ms
        - uptime_s
        - measured_at
      additionalProperties: false
    StatusCollector:
      type: object
      properties:
        state:
          type: string
          description: active while batches arrive, stopped after a clean stop, lost when batches stopped for 3 minutes, none before the first batch.
          enum:
            - active
            - stopped
            - lost
            - none
        version:
          type:
            - string
            - 'null'
        last_seen_at:
          type:
            - string
            - 'null'
          format: date-time
        layers:
          anyOf:
            - $ref: '#/components/schemas/CollectorLayersSummary'
            - type: 'null'
      required:
        - state
        - version
        - last_seen_at
        - layers
      additionalProperties: false
    Status:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/StatusState'
        since:
          type:
            - string
            - 'null'
          format: date-time
          description: When the current state began.
        server:
          $ref: '#/components/schemas/StatusServer'
        players:
          $ref: '#/components/schemas/StatusPlayers'
        performance:
          $ref: '#/components/schemas/StatusPerformance'
        clock:
          $ref: '#/components/schemas/WorldClock'
        collector:
          $ref: '#/components/schemas/StatusCollector'
        updated_at:
          type: string
          format: date-time
      required:
        - state
        - since
        - server
        - players
        - performance
        - clock
        - collector
        - updated_at
      additionalProperties: false
    StatusHistoryPoint:
      type: object
      properties:
        ts:
          type: string
          format: date-time
          description: Start of the bucket.
        state:
          $ref: '#/components/schemas/StatusState'
        players_max:
          type: integer
          minimum: 0
        players_avg:
          type: number
          minimum: 0
        fps_avg:
          type:
            - number
            - 'null'
      required:
        - ts
        - state
        - players_max
        - players_avg
        - fps_avg
      additionalProperties: false
    StatusHistory:
      type: object
      properties:
        range:
          type: string
          enum:
            - 24h
            - 7d
            - 30d
        bucket_s:
          type: integer
        points:
          type: array
          items:
            $ref: '#/components/schemas/StatusHistoryPoint'
      required:
        - range
        - bucket_s
        - points
      additionalProperties: false
    OnlinePlayer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        level:
          type: integer
          minimum: 0
        platform:
          $ref: '#/components/schemas/Platform'
        guild:
          anyOf:
            - $ref: '#/components/schemas/GuildRef'
            - type: 'null'
        joined_at:
          type: string
          format: date-time
        down:
          type: boolean
          description: True while the player lies defeated, before they respawn.
        hp:
          type:
            - number
            - 'null'
        max_hp:
          type:
            - number
            - 'null'
        position:
          description: Null unless the positions feature is on.
          anyOf:
            - $ref: '#/components/schemas/Point'
            - type: 'null'
        party:
          type: array
          description: Empty unless the pals feature is on.
          items:
            $ref: '#/components/schemas/PartyPal'
      required:
        - id
        - name
        - level
        - platform
        - guild
        - joined_at
        - down
        - hp
        - max_hp
        - position
        - party
      additionalProperties: false
    OnlineList:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/OnlinePlayer'
        updated_at:
          type: string
          format: date-time
      required:
        - players
        - updated_at
      additionalProperties: false
    ActivityType:
      type: string
      enum:
        - server.online
        - server.offline
        - collector.lost
        - player.joined
        - player.left
        - player.level_up
        - player.died
        - chat.message
        - base.established
        - base.removed
        - guild.renamed
        - player.guild_joined
        - pal.captured
        - pal.hatched
        - boss.defeated
        - technology.unlocked
    KillerKind:
      type:
        - string
        - 'null'
      description: Whether the killer is another player, a Pal or a human character. Null when the knockout had no attacker or the server mod is not installed.
      enum:
        - player
        - pal
        - human
        - null
    ChatChannel:
      type: string
      enum:
        - global
        - guild
        - say
        - other
    ActivityDetails:
      type: object
      description: 'Type-specific details. player.level_up: from, to. player.died: cause, killer, killer_kind, killer_level, and x, y, region with the positions feature. pal.captured and pal.hatched: species, species_name, level. boss.defeated: boss, boss_name, boss_kind, difficulty. technology.unlocked: technology, technology_name. player.left: session_s. chat.message: channel, text. base.established and base.removed: base_id, base_name, region, guild, x, y. guild.renamed: guild, old_name, new_name. player.guild_joined: guild, previous_guild. server.online: version. server.offline: reason. collector.lost: last_seen_at.'
      properties:
        from:
          type: integer
        to:
          type: integer
        cause:
          type:
            - string
            - 'null'
        killer:
          type:
            - string
            - 'null'
        killer_kind:
          $ref: '#/components/schemas/KillerKind'
        killer_level:
          type:
            - integer
            - 'null'
        species:
          type: string
          description: The Pal's species id, for example SheepBall.
        species_name:
          type:
            - string
            - 'null'
        level:
          type:
            - integer
            - 'null'
        boss:
          type: string
          description: The game's boss type for a tower, for example GrassBoss, or the summon id for a raid, for example PalSummon_NightLady.
        boss_name:
          type:
            - string
            - 'null'
        boss_kind:
          type: string
          enum:
            - tower
            - raid
        difficulty:
          type:
            - string
            - 'null'
          enum:
            - normal
            - hard
            - null
        technology:
          type: string
          description: The game's technology id, for example RepairBench.
        technology_name:
          type:
            - string
            - 'null'
        x:
          type: number
        y:
          type: number
        region:
          type:
            - string
            - 'null'
          description: The named area of the map at x, y.
        session_s:
          type:
            - number
            - 'null'
        channel:
          $ref: '#/components/schemas/ChatChannel'
        text:
          type: string
        base_id:
          type: integer
        base_name:
          type:
            - string
            - 'null'
        guild:
          anyOf:
            - $ref: '#/components/schemas/GuildRef'
            - type: 'null'
        previous_guild:
          anyOf:
            - $ref: '#/components/schemas/GuildRef'
            - type: 'null'
        old_name:
          type: string
        new_name:
          type: string
        version:
          type:
            - string
            - 'null'
        reason:
          type: string
        last_seen_at:
          type: string
          format: date-time
      additionalProperties: false
    ActivityItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/ActivityType'
        ts:
          type: string
          format: date-time
        player:
          anyOf:
            - $ref: '#/components/schemas/PlayerRef'
            - type: 'null'
        details:
          $ref: '#/components/schemas/ActivityDetails'
      required:
        - id
        - type
        - ts
        - player
        - details
      additionalProperties: false
    ActivityPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
      additionalProperties: false
    PlayerSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        level:
          type: integer
          minimum: 0
        platform:

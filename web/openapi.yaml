      properties:
        instance_id:
          type: string
        kind:
          type: string
          enum:
            - party
            - base
        class:
          type: string
          description: Blueprint class, for example BP_SheepBall_C.
        name:
          type:
            - string
            - 'null'
        level:
          type: integer
        hp:
          type:
            - number
            - 'null'
        max_hp:
          type:
            - number
            - 'null'
        owner_instance_id:
          type:
            - string
            - 'null'
        owner_player_id:
          $ref: '#/components/schemas/PlayerUid'
        owner_name:
          type:
            - string
            - 'null'
        guild_id:
          type:
            - string
            - 'null'
        action:
          type:
            - string
            - 'null'
        ai_action:
          type:

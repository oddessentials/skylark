          type: string
        name:
          type:
            - string
            - 'null'
        level:
          type: integer
        x:
          type: number
        y:
          type: number
      required:
        - class
        - level
        - x
        - y
      additionalProperties: true
    WorldSnapshotData:
      type: object
      description: The world as the server's game-data snapshot shows it, sent every few seconds. Players come from REST /v1/api/players when the snapshot is switched off.
      properties:
        source:
          type: string
          enum:
            - gamedata
            - rest
          description: gamedata when the snapshot comes from the server's game-data API, so pals, palboxes and wild are complete; rest when game-data is off and only the players from REST /v1/api/players are known, with pals, palboxes and wild empty.
        in_game_time:
          type:
            - string
            - 'null'
          pattern: ^[0-9]{2}:[0-9]{2}$
        in_game_day:
          type:
            - integer
            - 'null'
          minimum: 0
        players:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotPlayer'
        pals:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotPal'
        palboxes:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotPalBox'
        wild:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotWild'
        wild_omitted:
          type: integer
          minimum: 0
          description: Wild Pals left out to keep the snapshot under 400 KB, the lowest levels first; absent when none were.
        pals_omitted:
          type: integer
          minimum: 0
          description: Pals left out to keep the snapshot under 400 KB; absent when none were.
      required:
        - source
        - in_game_time
        - in_game_day
        - players
        - pals
        - palboxes
        - wild
      additionalProperties: true

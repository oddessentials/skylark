          type: number
          minimum: 0
        queue_depth:
          type: integer
          minimum: 0
        dropped_events:
          type: integer
          minimum: 0
        rest:
          type: string
          enum:
            - ok
            - down
            - off
        gamedata:
          type: string
          enum:
            - ok
            - off
            - unavailable
        logs:
          type: string
          enum:
            - ok
            - off
            - idle
            - error
        saves:
          type: string
          description: The save reader, from collectors that know it. ok after a successful read, waiting until the first one, off when no save reader is set up, error when the last read failed.
          enum:
            - ok
            - waiting
            - off
            - error
        mod:
          type: string
          description: The Skylark server mod's events file, from collectors that know it. ok while the collector reads it, waiting until the file appears, off when no mod is set up.

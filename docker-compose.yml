name: skylark-dev

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: skylark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skylark}
      POSTGRES_DB: skylark
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skylark -d skylark']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:

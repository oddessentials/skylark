name: skylark-dev

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: skylark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skylark}
      POSTGRES_DB: skylark
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skylark -d skylark']
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    profiles: [site]
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      DATABASE_URL: postgres://skylark:${POSTGRES_PASSWORD:-skylark}@db:5432/skylark
      COLLECTOR_SECRET: ${COLLECTOR_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      PUBLIC_SITE_NAME: ${PUBLIC_SITE_NAME}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PORT: '3000'
      API_MOCK: ${API_MOCK:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    volumes:
      - ./local/backups:/backups
    depends_on:
      db:
        condition: service_healthy

  collector:
    profiles: [remote]
    build:
      context: .
      dockerfile: collector/Dockerfile
    environment:
      SKYLARK_SITE_URL: http://web:3000
      SKYLARK_SITE_SECRET: ${COLLECTOR_SECRET}
      SKYLARK_PALWORLD_REST_URL: ${PALWORLD_REST_URL:-}
      SKYLARK_PALWORLD_ADMIN_PASSWORD: ${PALWORLD_ADMIN_PASSWORD:-}
      SKYLARK_SAVES_REMOTE: ${PALWORLD_SAVES_REMOTE:-}
      SKYLARK_SAVES_PASSWORD: ${PALWORLD_SAVES_PASSWORD:-}
      SKYLARK_SAVES_HOST_KEY: ${PALWORLD_SAVES_HOST_KEY:-}
      SKYLARK_LOGS_SOURCE: none
    volumes:
      - collector-journal:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  collector-journal:
